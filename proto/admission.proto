// Supervisor 单次账号准入. 登录, 幂等登记和成员快照在一个 RPC 中完成.
syntax = "proto3";
package verdandi.cluster.v1;
option go_package = "github.com/eosforge/verdandi/supervisor/internal/generated;wire";
import "cluster.proto";

service Admission {
    // 账号认证后持久提交, Star 得到完整 Star 名单, Planet 保留现有候选行为.
    // 同启动 request_id 重试不改变身份; 已被替换的请求返回冲突. 不再提供 Challenge.
    rpc Register(RegistrationRequest) returns (RegistrationResponse);
}
