// Supervisor 账号准入. 两个 RPC 均验证密码, 不能把查询到的基线作为授权凭据.
syntax = "proto3";
package verdandi.peer.v1;
option go_package = "github.com/eosforge/verdandi/supervisor/internal/generated;wire";
import "peer.proto";

service Admission {
    // 首次读取账号下该具体端点的重启代次. 重试保留第一次基线, 不抢回较新登记.
    rpc Challenge(LoginRequest) returns (RegistrationChallenge);
    // Star 得到完整 Star 名单, Planet 得到至多八个候选. 自身凭证独立签发.
    rpc Register(RegistrationRequest) returns (RegistrationResponse);
}

message LoginRequest {
    string username = 1;
    string password = 2;
    string cluster_id = 3;
    string advertise = 4;
}
