// Verdandi 服务控制协议. 修改后显式运行 scripts/generate-proto, 生成源码随本文件提交.
// v6 通过生成的 gRPC 方法传输, 不再使用自定义 TCP 帧头.
// message-ids.lock 保留旧编号历史, v6 不依赖这些编号调度. 删除字段永久保留.
syntax = "proto3";
package verdandi.cluster.v1;
option go_package = "github.com/eosforge/verdandi/supervisor/internal/generated;wire";

// TLS 1.3 建链后交换签名 bearer 凭证. 不携带第三方名单或业务数据.
message Hello {
    // 主版本为 6, 角色与逻辑组绑定到准入签名, 旧协议不能连接新服务.
    uint32 protocol_major = 1;
    uint32 protocol_minor = 2;
    // 旧版重复身份字段已移入签名的 Member 正文.
    reserved 3, 4, 5, 6;
    reserved "cluster_id", "id", "boot_id", "advertise";
    // 本端 payload 容量, 至少 1024 字节. 不改变当前阶段的硬上限.
    uint32 max_frame_bytes = 7;
    // 原样转发 Supervisor 返回的 Member 编码, 校验前不信任其中任何字段.
    bytes admission = 8;
    // Ed25519 签名, 覆盖域分隔前缀和 admission 原始字节.
    bytes admission_signature = 9;
    // 账号准入改用签名 bearer credential, 不再绑定 TLS exporter.
    reserved 10;
    reserved "session_proof";
}

// 每方向最多一个等待响应的心跳, 超时包括写入等待, 普通输入不延长期限.
message Ping {
    uint64 request_id = 1;
}
message Pong {
    uint64 request_id = 1;
}

// 账号通过 TLS 提交, Supervisor 从已验证账号和规范端点构建指纹.
message RegistrationRequest {
    string cluster_id = 1;
    // 旧启动身份, CAS 和票据字段不再由客户端提交.
    reserved 2, 5, 11, 12;
    reserved "id", "expected_epoch", "ticket", "ticket_signature";
    // 规范的具体 IP:PORT. 节点启动和其他节点拨号均验证服务端 IP SAN.
    string advertise = 3;
    reserved 4;
    reserved "public_key";
    // 必须属于账号允许的角色, UNSPECIFIED 非法.
    Role role = 6;
    // 连接偏好组, 如实际地域. 不改变 Galaxy 的数据或权限范围.
    string group = 7;
    // 仅 Planet 使用, 候选耗尽后递增以轮换小名单. 不影响进程准入代次或写入版本.
    uint32 candidate_round = 8;
    // 仅向 Supervisor 发送, 不复制到成员名单, 日志或节点间 Hello.
    string username = 9;
    string password = 10;
    // 本次启动生成一次的 32 字节随机幂等键, 所有重试和候选刷新复用, 不作为实例身份或授权凭据.
    // Supervisor 持久记住已提交请求; 被替换的旧请求不能再次登记.
    bytes request_id = 13;
}

// 登记持久提交后返回有界名单: Star 得到完整 Star 列表, Planet 得到最多 8 个候选.
message RegistrationResponse {
    // Star 按 id 严格排序并包含自身. Planet 本组优先, 每组内按 id 排序, 不含自身.
    repeated Member members = 1;
    // 本次登记的 Member 原始编码及其签名, 与完整名单放在同一个应答中.
    bytes admission = 2;
    bytes signature = 3;
    message Member {
        string cluster_id = 1;
        // Supervisor 签发的不透明 UTF-8 字符串, 长度 1..128 字节; 不规定 UUID 版本或字符格式.
        string id = 2;
        // SHA-256(username + NUL + cluster_id + NUL + advertise), 小写十六进制, 不替代本次启动的 id.
        string principal = 3;
        string advertise = 4;
        // 每部署身份的重启代次, 不用于 Catalog/Registry 的业务版本排序.
        uint64 epoch = 5;
        reserved 6;
        reserved "public_key";
        Role role = 7;
        string group = 8;
    }
}

// 仅保留 v3 生成类型和编号历史. v4 Admission 不返回此消息.
message PlanetRegistrationResponse {
    // 最多 8 个 Star, 本组在前, 各优先级内按 id 排序. 允许零候选并在退避后刷新.
    repeated RegistrationResponse.Member candidates = 1;
    bytes admission = 2;
    bytes signature = 3;
}

// 角色是准入权限的一部分, 不从端口、地址或存储模式推断.
enum Role {
    // 未指定角色, 准入请求拒绝此值.
    ROLE_UNSPECIFIED = 0;
    // 维护互联拓扑并接纳 Planet 上游连接的 Star.
    ROLE_STAR = 1;
    // 从授权候选中维持单个 Star 上游的 Planet.
    ROLE_PLANET = 2;
}

// 只传有限拒绝码, 不回显远端输入或内部错误. 收到后关闭连接, 不回复另一个错误.
message ProtocolError {
    ProtocolErrorCode code = 1;
}
enum ProtocolErrorCode {
    // 未指定错误, 不作为有效拒绝原因.
    PROTOCOL_ERROR_CODE_UNSPECIFIED = 0;
    // 控制协议主版本不兼容.
    PROTOCOL_ERROR_CODE_PROTOCOL_MISMATCH = 1;
    // 签名成员不属于当前 Galaxy.
    PROTOCOL_ERROR_CODE_CLUSTER_MISMATCH = 2;
    // Hello 缺少字段或身份绑定无效.
    PROTOCOL_ERROR_CODE_INVALID_HELLO = 3;
    // 拒绝连接当前运行实例自身.
    PROTOCOL_ERROR_CODE_SELF_CONNECTION = 4;
    // 连接或消息超过本端容量.
    PROTOCOL_ERROR_CODE_RESOURCE_LIMIT = 5;
    // 当前阶段不能接收此消息类型.
    PROTOCOL_ERROR_CODE_UNEXPECTED_MESSAGE = 6;
    // 认证握手未在期限内完成.
    PROTOCOL_ERROR_CODE_HANDSHAKE_TIMEOUT = 7;
    // 账号权限或准入凭证校验失败.
    PROTOCOL_ERROR_CODE_UNAUTHORIZED = 8;
    // 成员代次或会话所有权冲突.
    PROTOCOL_ERROR_CODE_CONFLICT = 9;
    // 登记持久存储暂时不可用.
    PROTOCOL_ERROR_CODE_STORAGE_UNAVAILABLE = 10;
}
