// Astra v1 节点间控制与动态来源复制消息. Orbit 凭证作为原始字节传输, 类型由 Orbit 唯一定义.
syntax = "proto3";
package proto.astra.v1;
option go_package = "github.com/eosforge/verdandi/astra/internal/generated/astra;astra";

// TLS 1.3 建链后交换签名 bearer 凭证. 不携带第三方名单或业务数据.
message Hello {
    // 主版本为 1, 角色与逻辑组绑定到准入签名, 旧协议不能连接新服务.
    uint32 protocol_major = 1;
    uint32 protocol_minor = 2;
    // 身份只在 Orbit 签名的 Member 正文中定义, 不在 Hello 重复.
    reserved 3, 4, 5, 6;
    reserved "galaxy", "id", "boot_id", "advertise";
    // 本端 payload 容量, 至少 1024 字节. 不改变当前阶段的硬上限.
    uint32 max_frame_bytes = 7;
    // 原样转发 Pulsar 返回的 Member 编码, 校验前不信任其中任何字段.
    bytes admission = 8;
    // Ed25519 签名, 覆盖域分隔前缀和 admission 原始字节.
    bytes admission_signature = 9;
    // 准入凭证通过签名验证, 不使用连接级证明字段.
    reserved 10;
    reserved "session_proof";
}

// 每方向最多一个等待响应的心跳, 超时包括写入等待, 普通输入不延长期限.
message Ping {
    uint64 request_id = 1;
}
message Pong {
    uint64 request_id = 1;
}

// 只传有限拒绝码, 不回显远端输入或内部错误. 收到后关闭连接, 不回复另一个错误.
message ProtocolError {
    ProtocolErrorCode code = 1;
}
enum ProtocolErrorCode {
    // 未指定错误, 不作为有效拒绝原因.
    PROTOCOL_ERROR_CODE_UNSPECIFIED = 0;
    // 控制协议主版本不兼容.
    PROTOCOL_ERROR_CODE_PROTOCOL_MISMATCH = 1;
    // 签名成员不属于当前 Galaxy.
    PROTOCOL_ERROR_CODE_CLUSTER_MISMATCH = 2;
    // Hello 缺少字段或身份绑定无效.
    PROTOCOL_ERROR_CODE_INVALID_HELLO = 3;
    // 拒绝连接当前运行实例自身.
    PROTOCOL_ERROR_CODE_SELF_CONNECTION = 4;
    // 连接或消息超过本端容量.
    PROTOCOL_ERROR_CODE_RESOURCE_LIMIT = 5;
    // 当前阶段不能接收此消息类型.
    PROTOCOL_ERROR_CODE_UNEXPECTED_MESSAGE = 6;
    // 认证握手未在期限内完成.
    PROTOCOL_ERROR_CODE_HANDSHAKE_TIMEOUT = 7;
    // 账号权限或准入凭证校验失败.
    PROTOCOL_ERROR_CODE_UNAUTHORIZED = 8;
    // 成员代次或会话所有权冲突.
    PROTOCOL_ERROR_CODE_CONFLICT = 9;
    // 登记持久存储暂时不可用.
    PROTOCOL_ERROR_CODE_STORAGE_UNAVAILABLE = 10;
}

// Star/Planet 的互联传输. Pulsar 准入使用 orbit.proto 中的 gRPC 接口.

// 每对 Star 保留一条双向逻辑会话. 双方第一条均为 Hello, 后续消息由当前阶段验证.
// 相反方向的竞争按发起方身份裁决, 不依赖底层连接是否复用.
// 拨号方先发送 Hello, 接收方验证准入后再返回自己的 bearer 凭证.
service StarTransport {
    rpc OpenSession(stream SessionPacket) returns (stream SessionPacket);
}

// 控制消息优先占用下一次写机会, 不能抢占已在途的帧. 来源身份始终从本流已验证的 Hello 取得.
message SessionPacket {
    oneof body {
        Hello hello = 1;
        Ping ping = 2;
        Pong pong = 3;
        ProtocolError rejection = 4;
        Position resume = 5;
        Position ack = 6;
        CatalogSnapshot catalog_snapshot = 7;
        CatalogChanges catalog_changes = 8;
        EphemerisSnapshot ephemeris_snapshot = 9;
        EphemerisChanges ephemeris_changes = 10;
        Repair repair = 11;
        Repaired repaired = 12;
    }
}

// Almanac 永远不进入对等来源域, 由 Polaris 直接向每台 Star 同步.
enum Domain {
    // 未提供域, 所有恢复或确认消息均拒绝此值.
    DOMAIN_UNSPECIFIED = 0;
    // 每 Key 业务版本/TTL 的业务发布数据.
    DOMAIN_CATALOG = 1;
    // 来源 Star 权威维护的临时注册.
    DOMAIN_EPHEMERIS = 2;
}

// 来源域的连续已安装位置, 覆盖全部 Scope. 初始零为合法空前缀, 不等于业务版本.
message Position {
    Domain domain = 1;
    uint64 version = 2;
}

// Scope 只定位记录, 不是独立的对等恢复边界.
message Scope {
    // UTF-8 文本内容不变, 类型改为 bytes 以跳过 Protobuf 层的重复 UTF-8 校验; 形状仍由各域入口校验.
    bytes sector = 1;
    bytes spectrum = 2;
}

// 明确的无正文分支, 不将合法的零字节正文误认为水位或删除.
message Empty {}

// 活动 Catalog 正文, deadline 为原始 Unix 纳秒截止, 接收者不得重算 TTL.
message CatalogValue {
    bytes value = 1;
    uint64 deadline = 2;
}

// 快照/完整发布事实含正内容版本; value 与 watermark 两个分支必须明确选一个.
message CatalogRecord {
    uint64 version = 1;
    oneof body {
        CatalogValue value = 2;
        Empty watermark = 3;
    }
}

// 完整来源清单的一行, 不包含第三方来源或合并视图.
message CatalogEntry {
    Scope scope = 1;
    string key = 2;
    CatalogRecord record = 3;
}

// 分页共享同一来源基线, complete 前不安装或 ACK; position=0 只允许空组.
message CatalogSnapshot {
    uint64 position = 1;
    repeated CatalogEntry entries = 2;
    bool complete = 3;
}

// 期限刷新只传当前业务版本和原截止, 缺正文时需精确回补, 不凭此创建记录.
message CatalogLease {
    uint64 version = 1;
    uint64 deadline = 2;
}

// 一个位置对应一个原子事实, 期限变化与内容变化均进入本来源连续序列.
message CatalogDelta {
    uint64 position = 1;
    Scope scope = 2;
    string key = 3;
    oneof action {
        CatalogRecord record = 4;
        CatalogLease lease = 5;
    }
}

// 装包不改变提交边界, 接收方只确认已完整安装的连续前缀.
message CatalogChanges {
    repeated CatalogDelta entries = 1;
    // 同一捕获边界的来源头部, 首次空组也发送一次 head=0 的空确认.
    uint64 head = 2;
}

// Ephemeris 原生完整行, Attr 永久固定, 两个 order 分别防止更新及续租乱序.
message EphemerisRecord {
    bytes attr = 1;
    bytes data = 2;
    uint64 deadline = 3;
    uint64 update = 4;
    uint64 renewal = 5;
    uint32 ttl_ms = 6;
}

// 标准 UUIDv4 原始 16 字节二进制索引, 不在续租路径反复格式化.
message EphemerisEntry {
    Scope scope = 1;
    bytes uuid = 2;
    EphemerisRecord record = 3;
}

// 完整组基线, 缺项只结束该来源旧记录, 不能清空其他 Star 的注册.
message EphemerisSnapshot {
    uint64 position = 1;
    repeated EphemerisEntry entries = 2;
    bool complete = 3;
}

// Data-only 不隐式延期, 未掌握 Attr 或完整记录时请求精确回补.
message EphemerisData {
    bytes data = 1;
    uint64 order = 2;
}

// 续租保留固定 TTL, 只更新原绝对截止及独立的续租 order.
message EphemerisLease {
    uint64 deadline = 1;
    uint64 order = 2;
}

// 只有来源 Star 的 Remove/到期才广播 erase; 接收者本地 TTL 不产生这个消息.
message EphemerisDelta {
    uint64 position = 1;
    Scope scope = 2;
    bytes uuid = 3;
    oneof action {
        EphemerisRecord record = 4;
        EphemerisData data = 5;
        EphemerisLease lease = 6;
        Empty erase = 7;
    }
}

// 一次网络发送可以携带多个严格连续提交, 不等于跨提交事务.
message EphemerisChanges {
    repeated EphemerisDelta entries = 1;
    // 用于首次恢复完成判断, 不允许以此跳过 entries 尚未完整处理的位置.
    uint64 head = 2;
}

// 目标及触发位置构成有界回补关联, 不新增全局请求序号. version 仅 Catalog 使用.
message Repair {
    Domain domain = 1;
    Scope scope = 2;
    // Catalog 为 UTF-8 Key, Ephemeris 为 16 字节 UUID 二进制; 域决定形状, 本字段不做文本约束.
    bytes key = 3;
    uint64 trigger = 4;
    uint64 version = 5;
}

// position 只覆盖本目标, 不能直接推进整个来源的累计 ACK.
// Catalog 无活动正文但已见版本必须返回 watermark, unknown 只用于真正未知目标.
message Repaired {
    Repair request = 1;
    uint64 position = 2;
    oneof result {
        CatalogRecord catalog = 3;
        EphemerisRecord ephemeris = 4;
        Empty unknown = 5;
    }
}
