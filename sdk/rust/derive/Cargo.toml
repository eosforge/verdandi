[package]
name = "verdandi-derive"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Derive macros for the Verdandi SDK"
repository = "https://github.com/eosforge/verdandi"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.103"
quote = "1.0.42"
syn = { version = "2.0.111", features = ["full"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
unwrap_used = "deny"
expect_used = "deny"
