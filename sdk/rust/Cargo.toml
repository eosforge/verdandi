[package]
name = "verdandi"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Verdandi distributed registration and discovery SDK"
repository = "https://github.com/eosforge/verdandi"

[workspace]
members = ["derive"]
resolver = "3"

[dependencies]
arc-swap = "1.9.2"
fastrand = "2.3.0"
fred = { version = "10.1.0", default-features = false, features = [
    "enable-rustls-ring",
    "dynamic-pool",
    "i-hashes",
    "i-keys",
    "i-pubsub",
    "i-scripts",
    "i-server",
    "i-sorted-sets",
    "sentinel-auth",
    "sentinel-client",
    "sha-1",
    "subscriber-client",
] }
futures-util = "0.3.32"
getrandom = "0.3.4"
itoa = "1.0.15"
redb = "2.6.3"
rmp = "0.8.15"
rmpv = "1.3.1"
rustls-pemfile = "2.2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
url = "2.5.8"
verdandi-derive = { version = "0.1.0", path = "derive" }

[dev-dependencies]
fred = { version = "10.1.0", default-features = false, features = ["i-client"] }
hex = "0.4.3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
unwrap_used = "deny"
expect_used = "deny"
