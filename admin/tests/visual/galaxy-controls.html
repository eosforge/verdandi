<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>星图选择状态验收</title>
    <style>
      html,
      body,
      #scene {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #050914;
      }
      nav {
        position: fixed;
        top: 12px;
        left: 12px;
        color: #eee;
        font: 14px sans-serif;
      }
      button {
        margin: 4px;
        padding: 8px;
      }
      output {
        display: block;
        margin: 4px;
      }
    </style>
  </head>
  <body>
    <div id="scene"></div>
    <nav aria-label="控制器验收">
      <button id="overview">返回总览</button>
      <button id="peer">进入 Atlas</button>
      <button id="planet">选择 Atlas 行星</button>
      <button id="foreign">选择 Lyra 行星</button>
      <button id="focus">推进至 Atlas 行星</button>
      <button id="spin">Atlas 自转 0.3 rad/s</button>
      <button id="stop-spin">停止 Atlas 自转</button>
      <output id="selection">总览</output>
      <output id="result">就绪</output>
    </nav>
    <script type="module">
      import { createGalaxyScene } from "/src/features/galaxy/runtime/createGalaxyScene.ts";
      import { demoGalaxy } from "/src/features/galaxy/data/demo.ts";
      const selection = document.getElementById("selection");
      const result = document.getElementById("result");
      const atlas = demoGalaxy.peers[0];
      const lyra = demoGalaxy.peers[1];
      // 按钮调用生产控制器, 不读写内部状态, 供验证总览和跨星系的程序化选择限制.
      const controller = await createGalaxyScene(document.getElementById("scene"), demoGalaxy, {
        select(value) {
          selection.textContent = value ? `${value.peer.name}: ${value.planet?.id ?? "恒星视图"}` : "总览";
        },
        fps() {},
        error(message) {
          result.textContent = message;
        },
      });
      document.getElementById("overview").onclick = () => {
        controller.overview();
        result.textContent = "返回总览";
      };
      document.getElementById("peer").onclick = () => {
        result.textContent = `进入恒星: ${controller.selectPeer(atlas.id)}`;
      };
      document.getElementById("planet").onclick = () => {
        result.textContent = `选择行星: ${controller.selectPlanet(atlas.id, atlas.planets[0].id)}`;
      };
      document.getElementById("foreign").onclick = () => {
        result.textContent = `选择其他星系: ${controller.selectPlanet(lyra.id, lyra.planets[0].id)}`;
      };
      document.getElementById("focus").onclick = () => {
        result.textContent = `推进行星: ${controller.focusPlanet(atlas.id, atlas.planets[0].id)}`;
      };
      // 仅验收页传入示例速度, 生产场景不根据数量或选择状态推导自转速度.
      document.getElementById("spin").onclick = () => {
        result.textContent = `设置自转: ${controller.setStarRotationSpeed(atlas.id, 0.3)}`;
      };
      document.getElementById("stop-spin").onclick = () => {
        result.textContent = `停止自转: ${controller.setStarRotationSpeed(atlas.id, 0)}`;
      };
      window.addEventListener("pagehide", () => controller.dispose(), { once: true });
    </script>
  </body>
</html>
